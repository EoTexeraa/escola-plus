<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Escola+ — sem conexão</title>
  <style>
    :root { color-scheme: light dark; --bg:#F8FAFC; --text:#0F172A; --muted:#475569; --primary:#1D4ED8; --on:#FFFFFF; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0B1220; --text:#E2E8F0; --muted:#94A3B8; --primary:#60A5FA; --on:#0B1220; } }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--text);
           font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align:center; padding:24px; box-sizing:border-box; }
    .logo { width:72px; height:72px; border-radius:18px; margin:0 auto 20px; background:linear-gradient(135deg,#1D4ED8,#0369A1); display:grid; place-items:center; }
    h1 { font-size:1.5rem; margin:0 0 8px; }
    p { color:var(--muted); margin:0 0 24px; line-height:1.5; }
    button { min-height:48px; padding:0 24px; border:0; border-radius:8px; background:var(--primary); color:var(--on); font-size:1rem; font-weight:600; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M12 7v14M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
    </div>
    <h1>Sem conexão</h1>
    <p>O Escola+ precisa de internet para mostrar suas notas e avisos.<br />Verifique o Wi-Fi ou os dados móveis.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
